[workspace]
resolver = "3"
members = [
    "crates/sim-core",
    "crates/league",
    "crates/protocol",
    "crates/ai",
    "crates/storage",
    "crates/cli",
    "crates/calibration",
    "crates/season",
    "crates/world",
    "crates/tactics",
    "crates/connect",
]

[workspace.package]
version = "0.0.0"
edition = "2024"
publish = false
license = "LicenseRef-Proprietary"

[workspace.dependencies]
libm = "0.2"
rand_chacha = "0.9"
rand_core = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
rayon = "1"

sim-core = { path = "crates/sim-core" }
protocol = { path = "crates/protocol" }
league = { path = "crates/league" }
ai = { path = "crates/ai" }
storage = { path = "crates/storage" }
calibration = { path = "crates/calibration" }
season = { path = "crates/season" }
world = { path = "crates/world" }
tactics = { path = "crates/tactics" }
connect = { path = "crates/connect" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
